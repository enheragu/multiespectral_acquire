<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">HITOS Acquisition GUI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
    <link rel="stylesheet" href="/hitos_static/css/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/local.css') }}">
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.classList.toggle('dark', t === 'dark');
        })();
    </script>
</head>
<body>
<div class="container">

    <header class="header">
        <div class="logo">
            <img src="/hitos_static/arvc_logo.png" alt="ARVC" class="logo-img">
            <div class="logo-text">
                <h1 id="gui-title">HITOS Acquisition GUI</h1>
                <p class="logo-subtitle">Multiespectral Camera System — ARVC/EEHA</p>
            </div>
        </div>
        <div class="header-info">
            <span class="acq-status" id="recordingStatus" data-status="idle">IDLE</span>
            <form id="control-form" style="display:contents">
                <button id="startBtn" class="btn-acq btn-acq-start" type="submit">▶ Start Recording</button>
            </form>
            <button id="stopBtn" class="btn-acq btn-acq-stop" type="button">■ Stop Recording</button>
        </div>
    </header>

    <!-- Camera stats — one group per camera, aligns with image grid below -->
    <div class="stats-bar">
        <div class="stat-group">
            <div class="stat-item">
                <span class="stat-label camera1-hz-label">LWIR Camera Hz</span>
                <span class="stat-value" id="frame_rate_lwir">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label camera1-num-label">LWIR Camera frames</span>
                <span class="stat-value" id="total_images_received_lwir">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label camera1-saved-label">LWIR Saved</span>
                <span class="stat-value" id="saved_frames_camera1">—</span>
            </div>
        </div>
        <div class="stat-group">
            <div class="stat-item">
                <span class="stat-label camera2-hz-label">Visible Camera Hz</span>
                <span class="stat-value" id="frame_rate_rgb">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label camera2-num-label">Visible Camera frames</span>
                <span class="stat-value" id="total_images_received_rgb">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label camera2-saved-label">Visible Saved</span>
                <span class="stat-value" id="saved_frames_camera2">—</span>
            </div>
        </div>
        <div class="stat-group lidar-element">
            <div class="stat-item">
                <span class="stat-label lidar-hz-label">LIDAR Hz</span>
                <span class="stat-value" id="frame_rate_lidar">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label lidar-num-label">LIDAR frames</span>
                <span class="stat-value" id="total_images_received_lidar">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label lidar-saved-label">LIDAR Saved</span>
                <span class="stat-value" id="saved_frames_lidar">—</span>
            </div>
        </div>
    </div>

    <!-- Camera images -->
    <div class="images-grid" id="images-container">
        <div class="image-card">
            <div class="image-card-header">
                <span id="camera1-img-title">LWIR Camera</span>
            </div>
            <div class="image-card-body">
                <img src="/stream/camera1" id="lwir_image" class="camera-img" alt="LWIR">
            </div>
        </div>
        <div class="image-card">
            <div class="image-card-header">
                <span id="camera2-img-title">Visible Camera</span>
            </div>
            <div class="image-card-body">
                <img src="/stream/camera2" id="rgb_image" class="camera-img" alt="Visible">
            </div>
        </div>
        <!-- LIDAR card: selector integrated in header -->
        <div class="image-card lidar-element" id="lidar-image-box">
            <div class="image-card-header">
                <span id="lidar-img-title">LIDAR</span>
                <select id="lidar_topic_select" class="topic-select-inline">
                    {% if lidar_topic_options %}
                        {% for option in lidar_topic_options %}
                            <option value="{{ option.topic }}" {% if option.topic == current_lidar_topic %}selected{% endif %}>{{ option.label }}</option>
                        {% endfor %}
                    {% else %}
                        <option value="/Multiespectral/ouster/reflec_image_cropped_sync" selected>Reflectivity Image</option>
                        <option value="/Multiespectral/ouster/signal_image_cropped_sync">Signal Image</option>
                        <option value="/Multiespectral/ouster/nearir_image_cropped_sync">Near-IR Image</option>
                    {% endif %}
                </select>
            </div>
            <div class="image-card-body">
                <img src="/stream/lidar" id="lidar_image" class="camera-img" alt="LIDAR">
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>
            <a href="https://github.com/enheragu/multiespectral_acquire" target="_blank" rel="noopener">HITOS Acquisition GUI v1.0</a>
            —
            <a href="https://arvc.umh.es/index.php?lang=en" target="_blank" rel="noopener">ARVC</a>
            /
            <a href="https://enheragu.github.io/" target="_blank" rel="noopener">EEHA</a>
        </p>
    </footer>
</div>

<div data-theme-toggle-host></div>

<script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
<script src="/hitos_static/js/ui-core.js"></script>
<script>
$(document).ready(function() {
    if (window.SharedUiCore) SharedUiCore.initThemeToggle();

    var socket = io.connect('http://' + document.domain + ':' + location.port);
    var lidarAvailable = false;

    // ── Acquisition controls ─────────────────────────────────────────────
    $('#control-form').submit(function(event) {
        event.preventDefault();
        $.post('/start', $(this).serialize());
    });

    $('#stopBtn').click(function() {
        $.post('/stop');
    });

    // ── Image size ───────────────────────────────────────────────────────
    function sendImageSize() {
        var targetSize = { width: 800, height: 600 };
        socket.emit('image_size', { lwir: targetSize, rgb: targetSize, lidar: targetSize });
    }

    // ── LIDAR visibility ─────────────────────────────────────────────────
    function updateLidarVisibility(available) {
        if (available !== lidarAvailable) {
            lidarAvailable = available;
            if (lidarAvailable) {
                $('.lidar-element').addClass('lidar-visible');
            } else {
                $('.lidar-element').removeClass('lidar-visible');
            }
            setTimeout(sendImageSize, 100);
        }
    }

    sendImageSize();

    // ── Socket data update ───────────────────────────────────────────────
    socket.on('update_data', function(data) {
        if (data.gui_title) {
            $('#gui-title').text(data.gui_title);
            $('#page-title').text(data.gui_title);
        }
        if (data.camera1_name) {
            $('#camera1-img-title').text(data.camera1_name);
            $('.camera1-hz-label').text(data.camera1_name + ' Hz');
            $('.camera1-num-label').text(data.camera1_name + ' frames');
            $('.camera1-saved-label').text(data.camera1_name + ' saved');
        }
        if (data.camera2_name) {
            $('#camera2-img-title').text(data.camera2_name);
            $('.camera2-hz-label').text(data.camera2_name + ' Hz');
            $('.camera2-num-label').text(data.camera2_name + ' frames');
            $('.camera2-saved-label').text(data.camera2_name + ' saved');
        }
        if (data.lidar_name) {
            $('#lidar-img-title').text(data.lidar_name);
            $('.lidar-hz-label').text(data.lidar_name + ' Hz');
            $('.lidar-num-label').text(data.lidar_name + ' frames');
            $('.lidar-saved-label').text(data.lidar_name + ' saved');
        }

        updateLidarVisibility(data.lidar_available || false);

        // Recording status
        var status = (data.recording_status || 'IDLE').toLowerCase().replace(/ /g, '-');
        $('#recordingStatus').attr('data-status', status).text(data.recording_status || 'IDLE');

        // Stats
        $('#frame_rate_lwir').text(data.frame_rate_camera1 || '—');
        $('#total_images_received_lwir').text(data.total_images_received_camera1 || '—');
        $('#saved_frames_camera1').text(data.recording_enabled ? (data.saved_frames_camera1 || 0) : '—');
        $('#frame_rate_rgb').text(data.frame_rate_camera2 || '—');
        $('#total_images_received_rgb').text(data.total_images_received_camera2 || '—');
        $('#saved_frames_camera2').text(data.recording_enabled ? (data.saved_frames_camera2 || 0) : '—');

        // Images stream via MJPEG (<img src="/stream/...">), not over Socket.IO.

        // LIDAR
        if (data.lidar_available) {
            $('#frame_rate_lidar').text(data.frame_rate_lidar || '—');
            $('#total_images_received_lidar').text(data.total_images_received_lidar || '—');
            $('#saved_frames_lidar').text(data.recording_enabled ? (data.saved_frames_lidar || 0) : '—');
        }

        // LIDAR topic dropdown (only rebuild if options actually changed)
        if (data.lidar_topic_options && data.lidar_topic_options.length > 0) {
            var dropdown = $('#lidar_topic_select');
            var currentOptions = dropdown.find('option').map(function() { return $(this).val(); }).get();
            var newOptions = data.lidar_topic_options.map(function(o) { return o.topic; });
            if (JSON.stringify(currentOptions.sort()) !== JSON.stringify(newOptions.slice().sort())) {
                var saved = data.current_lidar_topic || dropdown.val();
                dropdown.empty();
                $.each(data.lidar_topic_options, function(_, o) {
                    dropdown.append($('<option>', { value: o.topic, text: o.label, selected: o.topic === saved }));
                });
            }
        }
    });

    // ── LIDAR topic change ───────────────────────────────────────────────
    $('#lidar_topic_select').change(function() {
        socket.emit('change_lidar_topic', { topic: $(this).val() });
    });
});
</script>
</body>
</html>
