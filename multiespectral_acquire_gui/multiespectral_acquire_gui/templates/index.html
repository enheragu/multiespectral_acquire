<!DOCTYPE html>
<html manifest="{{ url_for('static', filename='manifest.appcache') }}">
<head>
    <title id="page-title">Camera GUI</title>
    <!-- Downloaded bootstrap.min for interface to work without internet connection -->
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        #images-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            width: 100%;
            margin: 20px 0;
        }
        .image-box {
            flex: 1;
            margin: 10px 5px;
            max-width: none;
            width: 50%;
        }
        .image-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .orientation-layout {
            display: none; /* Oculta por defecto */
        }
        /* LIDAR elements hidden by default */
        .lidar-element {
            display: none;
        }
        .lidar-element.lidar-visible {
            display: block;
        }
        /* For flex containers with lidar */
        .lidar-flex-element {
            display: none;
        }
        .lidar-flex-element.lidar-visible {
            display: flex;
        }
        @media (orientation: landscape) {
            #layout-landscape {
                display: block; /* Muestra el diseño para landscape */
            }
        }
        @media (orientation: portrait) {
            #layout-portrait {
                display: block; /* Muestra el diseño para portrait */
            }
            #images-container {
                display: flex;
                flex-direction: column; /* Imágenes en una columna */
            }
            .image-box {
                max-width: 100%; /* Imágenes ocupan todo el ancho */
                width: 100%;
                margin: 10px 0;
            }
            .btn {
                min-height: 100px;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="gui-title">Camera GUI</h1>
        <form id="control-form">
            <div class="form-row">
                <div class="col">
                    <button id="startBtn" class="btn btn-success btn-block" type="submit">Start Acquisition Storage</button>
                </div>
                <div class="col">
                    <button id="stopBtn" class="btn btn-danger btn-block" type="button">Stop Acquisition Storage</button>
                </div>
                <div class="col d-flex align-items-center justify-content-center" style="min-height: 38px;"> 
                    <div class="w-100 text-center">
                        <strong>Storage status:</strong> <span id="recordingStatus" class="badge badge-secondary" style="font-size: 1.0em; padding: 0.5em 1em;">IDLE</span>
                    </div>
                </div>
            </div>
            <!-- Layout para landscape -->
            <div id="layout-landscape" class="orientation-layout">
                <div class="form-row">
                    <div class="col">
                        <label for="frame_rate_lwir_landscape" class="camera1-hz-label">LWIR (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_lwir_landscape" name="frame_rate_lwir" readonly>
                    </div>
                    <div class="col">
                        <label for="total_images_received_lwir_landscape" class="camera1-num-label">LWIR (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_lwir_landscape" name="total_images_received_lwir" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="col">
                        <label for="frame_rate_rgb_landscape" class="camera2-hz-label">RGB (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_rgb_landscape" name="frame_rate_rgb" readonly>
                    </div>
                    <div class="col">
                        <label for="total_images_received_rgb_landscape" class="camera2-num-label">RGB (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_rgb_landscape" name="total_images_received_rgb" readonly>
                    </div>
                </div>
                <!-- LIDAR row - landscape (hidden by default) -->
                <div class="form-row lidar-element" id="lidar-row-landscape">
                    <div class="col">
                        <label for="frame_rate_lidar_landscape" class="lidar-hz-label">LIDAR (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_lidar_landscape" name="frame_rate_lidar" readonly>
                    </div>
                    <div class="col">
                        <label for="total_images_received_lidar_landscape" class="lidar-num-label">LIDAR (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_lidar_landscape" name="total_images_received_lidar" readonly>
                    </div>
                </div>
            </div>
            <!-- Layout para portrait -->
            <div id="layout-portrait" class="orientation-layout">
                <div class="form-row">
                    <div class="col">
                        <label for="frame_rate_lwir_portrait" class="camera1-hz-label">LWIR (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_lwir_portrait" name="frame_rate_lwir" readonly>
                    </div>
                    <div class="col">
                        <label for="frame_rate_rgb_portrait" class="camera2-hz-label">RGB (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_rgb_portrait" name="frame_rate_rgb" readonly>
                    </div>
                    <!-- LIDAR column - portrait (hidden by default) -->
                    <div class="col lidar-element" id="lidar-col-portrait-hz">
                        <label for="frame_rate_lidar_portrait" class="lidar-hz-label">LIDAR (Hz):</label>
                        <input type="text" class="form-control" id="frame_rate_lidar_portrait" name="frame_rate_lidar" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="col">
                        <label for="total_images_received_lwir_portrait" class="camera1-num-label">LWIR (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_lwir_portrait" name="total_images_received_lwir" readonly>
                    </div>
                    <div class="col">
                        <label for="total_images_received_rgb_portrait" class="camera2-num-label">RGB (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_rgb_portrait" name="total_images_received_rgb" readonly>
                    </div>
                    <!-- LIDAR column - portrait (hidden by default) -->
                    <div class="col lidar-element" id="lidar-col-portrait-num">
                        <label for="total_images_received_lidar_portrait" class="lidar-num-label">LIDAR (num img):</label>
                        <input type="text" class="form-control" id="total_images_received_lidar_portrait" name="total_images_received_lidar" readonly>
                    </div>
                </div>
            </div>
        </form>
        <div id="images-container">
            <div class="image-box">
                <h3 id="camera1-img-title">LWIR Img</h3>
                <img src="" id="lwir_image" class="img-fluid">
            </div>
            <div class="image-box">
                <h3 id="camera2-img-title">RGB Img</h3>
                <img src="" id="rgb_image" class="img-fluid">
            </div>
            <!-- LIDAR image box (hidden by default) -->
            <div class="image-box lidar-element" id="lidar-image-box">
                <h3 id="lidar-img-title">LIDAR Img</h3>
                <img src="" id="lidar_image" class="img-fluid">
            </div>
        </div>
        
        <!-- LIDAR Topic Selector (always visible, at the bottom) -->
        <div id="lidar-topic-selector">
            <hr>
            <div class="form-group">
                <label for="lidar_topic_select"><strong>LIDAR Image Source:</strong></label>
                <select class="form-control" id="lidar_topic_select">
                    <option value="/Multiespectral/ouster/range_image_cropped_sync">Range Image</option>
                    <option value="/Multiespectral/ouster/reflec_image_cropped_sync" selected>Reflectivity Image</option>
                    <option value="/Multiespectral/ouster/signal_image_cropped_sync">Signal Image</option>
                    <option value="/Multiespectral/ouster/nearir_image_cropped_sync">Near-IR Image</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Downloaded js files for interface to work without internet connection -->
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script> 
    <!-- <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script> -->
    <script>
        $(document).ready(function() {
            var socket = io.connect('http://' + document.domain + ':' + location.port);
            var lidarAvailable = false;

            $("#control-form").submit(function(event) {
                event.preventDefault();
                $.post("/start", $(this).serialize(), function(data) {
                    $("#status").text(data.status);
                });
            });

            $("#stopBtn").click(function() {
                $.post("/stop", function(data) {
                    $("#status").text(data.status);
                });
            });

            function sendImageSize() {
                var lwirImageContainer = $('#lwir_image').parent();
                var rgbImageContainer = $('#rgb_image').parent();
                var lidarImageContainer = $('#lidar_image').parent();
                var lwirSize = { width: lwirImageContainer.width(), height: lwirImageContainer.height() };
                var rgbSize = { width: rgbImageContainer.width(), height: rgbImageContainer.height() };
                var lidarSize = { width: lidarImageContainer.width(), height: lidarImageContainer.height() };
                socket.emit('image_size', { lwir: lwirSize, rgb: rgbSize, lidar: lidarSize });
            }

            function updateLidarVisibility(available) {
                if (available !== lidarAvailable) {
                    lidarAvailable = available;
                    if (lidarAvailable) {
                        $('.lidar-element').addClass('lidar-visible');
                        $('.lidar-flex-element').addClass('lidar-visible');
                    } else {
                        $('.lidar-element').removeClass('lidar-visible');
                        $('.lidar-flex-element').removeClass('lidar-visible');
                    }
                    // Update image sizes after visibility change
                    setTimeout(sendImageSize, 100);
                }
            }

            sendImageSize();

            socket.on('update_data', function(data) {
                // Update GUI title if provided
                if (data.gui_title) {
                    $('#gui-title').text(data.gui_title);
                    $('#page-title').text(data.gui_title);
                }
                
                // Update display names if provided
                if (data.camera1_name) {
                    // Update image title
                    $('#camera1-img-title').text(data.camera1_name + ' Img');
                    // Update Hz labels
                    $('.camera1-hz-label').text(data.camera1_name + ' (Hz):');
                    // Update image count labels
                    $('.camera1-num-label').text(data.camera1_name + ' (Num img):');
                }
                if (data.camera2_name) {
                    // Update image title
                    $('#camera2-img-title').text(data.camera2_name + ' Img');
                    // Update Hz labels
                    $('.camera2-hz-label').text(data.camera2_name + ' (Hz):');
                    // Update image count labels
                    $('.camera2-num-label').text(data.camera2_name + ' (Num img):');
                }
                if (data.lidar_name) {
                    // Update image title
                    $('#lidar-img-title').text(data.lidar_name + ' Image');
                    // Update Hz labels
                    $('.lidar-hz-label').text(data.lidar_name + ' (Hz):');
                    // Update image count labels
                    $('.lidar-num-label').text(data.lidar_name + ' (Num img):');
                }
                
                // Update LIDAR visibility based on server data
                updateLidarVisibility(data.lidar_available || false);
                
                // Update recording status badge with detailed states
                var statusBadge = $('#recordingStatus');
                var status = data.recording_status || 'IDLE';
                
                statusBadge.removeClass('badge-secondary badge-success badge-warning badge-danger badge-info');
                
                switch(status) {
                    case 'RECORDING':
                        statusBadge.addClass('badge-success');
                        statusBadge.text('RECORDING');
                        break;
                    case 'RECORDING REQUESTED':
                        statusBadge.addClass('badge-warning');
                        statusBadge.text('RECORDING REQUESTED');
                        break;
                    case 'STOP REQUESTED':
                        statusBadge.addClass('badge-info');
                        statusBadge.text('STOP REQUESTED');
                        break;
                    case 'IDLE':
                    default:
                        statusBadge.addClass('badge-secondary');
                        statusBadge.text('IDLE');
                        break;
                }
                
                // Support both old naming (lwir/rgb) and new generic naming (camera1/camera2)
                var frameRate1 = data.frame_rate_camera1 || data.frame_rate_lwir || '';
                var frameRate2 = data.frame_rate_camera2 || data.frame_rate_rgb || '';
                var totalImg1 = data.total_images_received_camera1 || data.total_images_received_lwir || '';
                var totalImg2 = data.total_images_received_camera2 || data.total_images_received_rgb || '';
                var imgPath1 = data.camera1_img_path || data.lwir_img_path || '';
                var imgPath2 = data.camera2_img_path || data.rgb_img_path || '';
                
                // Actualizar datos de layout-landscape
                $('#frame_rate_camera1_landscape, #frame_rate_lwir_landscape').val(frameRate1);
                $('#total_images_received_camera1_landscape, #total_images_received_lwir_landscape').val(totalImg1);
                
                $('#frame_rate_camera2_landscape, #frame_rate_rgb_landscape').val(frameRate2);
                $('#total_images_received_camera2_landscape, #total_images_received_rgb_landscape').val(totalImg2);

                // Actualizar datos de layout-portrait
                $('#frame_rate_camera1_portrait, #frame_rate_lwir_portrait').val(frameRate1);
                $('#frame_rate_camera2_portrait, #frame_rate_rgb_portrait').val(frameRate2);
                $('#total_images_received_camera1_portrait, #total_images_received_lwir_portrait').val(totalImg1);
                $('#total_images_received_camera2_portrait, #total_images_received_rgb_portrait').val(totalImg2);
                
                $('#camera1_image, #lwir_image').attr('src', 'data:image/jpeg;base64,' + imgPath1);
                $('#camera2_image, #rgb_image').attr('src', 'data:image/jpeg;base64,' + imgPath2);
                
                // LIDAR data (only if available)
                if (data.lidar_available) {
                    $('#frame_rate_lidar_landscape').val(data.frame_rate_lidar);
                    $('#total_images_received_lidar_landscape').val(data.total_images_received_lidar);
                    $('#frame_rate_lidar_portrait').val(data.frame_rate_lidar);
                    $('#total_images_received_lidar_portrait').val(data.total_images_received_lidar);
                    if (data.lidar_img_path) {
                        $('#lidar_image').attr('src', 'data:image/jpeg;base64,' + data.lidar_img_path);
                    }
                }
            });

            window.addEventListener("orientationchange", function() {
                const landscapeLayout = document.getElementById('layout-landscape');
                const portraitLayout = document.getElementById('layout-portrait');
                if (window.innerHeight > window.innerWidth) {
                    // Portrait
                    landscapeLayout.style.display = 'none';
                    portraitLayout.style.display = 'block';
                } else {
                    // Landscape
                    landscapeLayout.style.display = 'block';
                    portraitLayout.style.display = 'none';
                }
            });

            // Ejecutar una vez al cargar la página
            window.dispatchEvent(new Event('orientationchange'));

            // Handle LIDAR topic selection change
            $('#lidar_topic_select').change(function() {
                console.log('='.repeat(80));
                console.log('[GUI] ============ DROPDOWN CHANGED ============');
                var selectedTopic = $(this).val();
                console.log('[GUI] Selected topic:', selectedTopic);
                console.log('[GUI] Emitting change_lidar_topic to server...');
                
                socket.emit('change_lidar_topic', { topic: selectedTopic });
                
                console.log('[GUI] Event emitted successfully');
                console.log('='.repeat(80));
                
                // Visual confirmation
                alert('Topic changed to: ' + selectedTopic);
            });

        });
    </script>
</body>
</html>
